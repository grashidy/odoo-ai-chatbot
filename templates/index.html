<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Odoo AI Assistant — Construction ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ── Design tokens ─────────────────────────────────────────────── */
:root {
  /* Backgrounds */
  --bg:        #030c18;
  --surface:   #061628;
  --card:      #091e38;
  --card2:     #0d2545;
  --panel:     #071a32;

  /* Borders */
  --border:    #10304e;
  --border2:   #1a4a70;
  --border3:   #234f78;

  /* Gold */
  --gold:      #b8820a;
  --gold2:     #e0a820;
  --gold-dim:  rgba(184,130,10,0.10);
  --gold-dim2: rgba(184,130,10,0.20);

  /* Corporate blue */
  --blue:      #1a6db5;
  --blue2:     #2a8de0;
  --blue-dim:  rgba(26,109,181,0.10);

  /* Status */
  --green:     #0d9e6e;
  --green2:    #12c789;
  --red:       #dc3545;
  --teal:      #0b8a7c;
  --purple:    #6b3fa0;
  --orange:    #c96220;
  --pink:      #b8306a;
  --cyan:      #0e8aaa;

  /* Text */
  --text:      #c8ddf0;
  --text2:     #527fa8;
  --text3:     #2d4f6e;

  /* Layout */
  --radius:    10px;
  --shadow:    0 6px 32px rgba(0,0,0,0.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-size: 13.5px;
  line-height: 1.6;
}

/* ── Scrollbars ────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Header ────────────────────────────────────────────────────── */
header {
  height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--blue) 70%, transparent 100%);
  opacity: 0.35;
}

.logo-badge {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  box-shadow: 0 0 14px rgba(184,130,10,0.4);
  flex-shrink: 0;
}

.hdr-brand { line-height: 1.2; }
.hdr-brand h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.hdr-brand p  { font-size: 10px; color: var(--text3); font-weight: 400; letter-spacing: 0.3px; text-transform: uppercase; }

.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }

.status-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(13,158,110,0.08); border: 1px solid rgba(13,158,110,0.2);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; color: var(--green2); font-weight: 600; white-space: nowrap;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green2); box-shadow: 0 0 5px var(--green2);
  animation: blink-dot 2.2s infinite;
}
@keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.35} }

.hbtn {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 6px; padding: 5px 11px;
  color: var(--text2); font-size: 12px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: border-color .12s, color .12s, background .12s;
  font-family: inherit; text-decoration: none; white-space: nowrap;
}
.hbtn:hover { border-color: var(--gold); color: var(--gold2); }
.hbtn.active { border-color: var(--gold) !important; color: var(--gold2) !important; background: var(--gold-dim) !important; }
.hbtn.new:hover { border-color: var(--green); color: var(--green2); }

/* ── Settings panel ────────────────────────────────────────────── */
#settings-panel {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 20px; display: none; align-items: center; gap: 8px; flex-shrink: 0;
}
#settings-panel label { font-size: 12px; color: var(--text2); white-space: nowrap; }
#api-key-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 12px; font-family: monospace;
}
#api-key-input:focus { outline: none; border-color: var(--gold); }
.btn-save {
  background: var(--gold); color: #06101d; border: none;
  padding: 6px 14px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-weight: 700; font-family: inherit; transition: background .12s;
}
.btn-save:hover { background: var(--gold2); }

/* ── TTS button ────────────────────────────────────────────────── */
.tts-btn {
  background: none; border: 1px solid var(--border2); border-radius: 6px;
  color: var(--text3); cursor: pointer; padding: 4px 8px; font-size: 16px;
  transition: all .12s;
}
.tts-btn.on  { border-color: var(--gold); color: var(--gold2); }
.tts-btn:hover { border-color: var(--gold); color: var(--gold2); }

/* ── Messages pane ─────────────────────────────────────────────── */
#messages {
  flex: 1; overflow-y: auto; padding: 20px 0;
  display: flex; flex-direction: column; scroll-behavior: smooth;
}

/* ── Welcome screen ────────────────────────────────────────────── */
#welcome {
  max-width: 1080px; margin: 0 auto; width: 100%;
  padding: 4px 28px 32px; display: flex; flex-direction: column; align-items: center;
}

.welcome-hero {
  text-align: center; margin-bottom: 24px;
}
.hero-icon-wrap {
  width: 60px; height: 60px; margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border2);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 20px rgba(184,130,10,0.15);
}
.welcome-hero h2 {
  font-size: 22px; font-weight: 700; color: var(--text);
  letter-spacing: -0.4px; margin-bottom: 7px;
}
.welcome-hero .sub-en {
  font-size: 13px; color: var(--text2); max-width: 480px; margin: 0 auto;
}
.welcome-hero .sub-ar {
  font-family: 'Cairo', sans-serif; direction: rtl;
  font-size: 12px; color: var(--text3); margin-top: 4px;
}

/* ── Category grid ─────────────────────────────────────────────── */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(264px, 1fr));
  gap: 10px; width: 100%;
}

.cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .12s, background .12s;
}
.cat-card:hover { border-color: var(--border2); background: var(--card2); }

.cat-card-top {
  padding: 12px 13px 9px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 9px;
}
.cat-icon-box {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--panel); border: 1px solid var(--cat-color, var(--gold));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.cat-name  { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; }
.cat-model {
  font-size: 9.5px; font-family: monospace;
  color: var(--cat-color, var(--gold)); margin-top: 2px;
  opacity: 0.8; letter-spacing: 0.2px;
}
.cat-accent-bar {
  height: 2px;
  background: var(--cat-color, var(--gold));
  opacity: 0.6;
}

.cat-card.c-re     { --cat-color: #2a8de0; }
.cat-card.c-proj   { --cat-color: #1a6fbd; }
.cat-card.c-boq    { --cat-color: #b8820a; }
.cat-card.c-sub    { --cat-color: #c96220; }
.cat-card.c-pay    { --cat-color: #0d9e6e; }
.cat-card.c-plan   { --cat-color: #0b8a7c; }
.cat-card.c-po     { --cat-color: #6b3fa0; }
.cat-card.c-hr     { --cat-color: #b8306a; }

.cat-qs { padding: 8px 10px 10px; }

.suggestion {
  display: block; padding: 6px 9px;
  font-size: 11.5px; color: var(--text2);
  border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 5px;
  cursor: pointer; line-height: 1.4;
  transition: border-color .1s, color .1s, background .1s;
  text-align: left; background: rgba(255,255,255,0.012);
}
.suggestion:last-child { margin-bottom: 0; }
.suggestion:hover {
  border-color: var(--cat-color, var(--gold));
  color: var(--text);
  background: rgba(255,255,255,0.03);
  padding-left: 12px;
}
.suggestion.ar { font-family: 'Cairo', sans-serif; text-align: right; direction: rtl; }
.suggestion.ar:hover { padding-left: 9px; padding-right: 12px; }

/* ── Chat rows ─────────────────────────────────────────────────── */
.msg-row {
  padding: 3px 24px;
  max-width: 1080px; margin: 0 auto; width: 100%;
  display: flex; gap: 10px;
}
.msg-row.user      { flex-direction: row-reverse; }
.msg-row.assistant { flex-direction: row; }

.avatar {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; margin-top: 6px;
}
.avatar.user-av { background: linear-gradient(135deg,#0d2545,#091e38); border: 1px solid var(--border2); }
.avatar.ai-av   { background: linear-gradient(135deg,#b8820a,#e0a820); box-shadow: 0 0 10px rgba(184,130,10,0.3); }

.bubble {
  max-width: 820px; padding: 12px 15px;
  border-radius: 12px; font-size: 13.5px; line-height: 1.7;
  word-break: break-word;
}
.msg-row.user .bubble {
  background: linear-gradient(135deg, #0a2a5e, #0f3480);
  color: var(--text); border-radius: 12px 3px 12px 12px;
  box-shadow: 0 3px 12px rgba(10,42,94,0.5);
}
.msg-row.assistant .bubble {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 3px 12px 12px 12px;
}

/* Bubble typography */
.bubble h3 {
  font-size: 13.5px; font-weight: 700; color: var(--gold2);
  margin: 14px 0 7px; padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}
.bubble h3:first-child { margin-top: 0; }
.bubble strong { color: #b8d8f0; font-weight: 600; }
.bubble em { color: var(--gold2); font-style: normal; font-weight: 500; }
.bubble code {
  background: rgba(184,130,10,0.1); color: var(--gold2);
  padding: 1px 5px; border-radius: 4px;
  font-family: 'Consolas', monospace; font-size: 12px;
}
.bubble ul, .bubble ol { padding-left: 18px; margin: 7px 0; }
.bubble li { margin-bottom: 4px; }
.bubble ul li::marker { color: var(--gold); }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble[dir="rtl"] { direction: rtl; text-align: right; font-family: 'Cairo', 'Inter', sans-serif; }
.bubble[dir="rtl"] ul, .bubble[dir="rtl"] ol { padding-right: 18px; padding-left: 0; }

/* ── Report Module (tabbed output) ─────────────────────────────── */
.report-module {
  margin: 10px 0;
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
  background: var(--panel);
}

.rm-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex; align-items: stretch;
  gap: 0;
}

.rm-tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 9px 14px; font-size: 11.5px; font-weight: 600;
  color: var(--text3); cursor: pointer; transition: color .12s, border-color .12s;
  font-family: inherit; white-space: nowrap; margin-bottom: -1px;
}
.rm-tab:hover { color: var(--text2); }
.rm-tab.active { color: var(--gold2); border-bottom-color: var(--gold); }

.rm-tab-spacer { flex: 1; }

.rm-actions {
  display: flex; align-items: center; gap: 5px; padding: 5px 0;
}

.rm-pane { display: none; padding: 14px; }
.rm-pane.active { display: block; }

/* KPI tiles inside report module */
.rm-kpi-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.rm-kpi {
  flex: 1; min-width: 100px; max-width: 180px;
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 10px 13px;
}
.rm-kpi-val {
  font-size: 20px; font-weight: 700; color: var(--gold2);
  font-variant-numeric: tabular-nums; line-height: 1.1;
}
.rm-kpi-lbl {
  font-size: 10.5px; color: var(--text3); margin-top: 3px;
  font-weight: 500; letter-spacing: 0.2px;
}

/* Table inside report module */
.rm-table-wrap { overflow-x: auto; }
.rm-table {
  width: 100%; border-collapse: collapse;
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.rm-table thead tr {
  background: rgba(184,130,10,0.08);
  border-bottom: 1px solid var(--border2);
}
.rm-table thead th {
  padding: 8px 12px; text-align: left;
  color: var(--gold2); font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap;
}
.rm-table tbody tr {
  border-bottom: 1px solid rgba(16,48,78,0.7);
  transition: background .1s;
}
.rm-table tbody tr:last-child { border-bottom: none; }
.rm-table tbody tr:nth-child(even) { background: rgba(9,30,56,0.5); }
.rm-table tbody tr:hover { background: rgba(184,130,10,0.04); }
.rm-table tbody td { padding: 7px 12px; color: var(--text); }
.rm-table[dir="rtl"] thead th, .rm-table[dir="rtl"] tbody td { text-align: right; }

/* Chart pane */
.rm-chart-wrap { position: relative; height: 230px; }

/* Export pane */
.rm-export-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.rm-export-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid; transition: all .12s; font-family: inherit;
  text-decoration: none;
}
.rm-export-btn.excel {
  background: rgba(13,158,110,0.08); border-color: rgba(13,158,110,0.3); color: var(--green2);
}
.rm-export-btn.excel:hover { background: rgba(13,158,110,0.15); }
.rm-export-btn.csv {
  background: rgba(26,109,181,0.08); border-color: rgba(26,109,181,0.3); color: var(--blue2);
}
.rm-export-btn.csv:hover { background: rgba(26,109,181,0.15); }
.rm-export-btn.wa {
  background: rgba(37,211,102,0.07); border-color: rgba(37,211,102,0.25); color: #25d366;
}
.rm-export-btn.wa:hover { background: rgba(37,211,102,0.14); }
.rm-export-note { font-size: 11px; color: var(--text3); margin-top: 8px; }

/* ── Status badges ─────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 10px;
  font-size: 10.5px; font-weight: 700;
}
.badge.available  { background: rgba(13,158,110,0.1);  color: #12c789; }
.badge.contracted { background: rgba(184,130,10,0.12); color: #e0a820; }
.badge.reserved   { background: rgba(26,109,181,0.12); color: #2a8de0; }
.badge.booked     { background: rgba(107,63,160,0.12); color: #9b6fd6; }
.badge.delivered  { background: rgba(11,138,124,0.12); color: #0ecfc0; }
.badge.cancelled  { background: rgba(220,53,69,0.10);  color: #ef5a68; }
.badge.draft,
.badge.hold,
.badge.held       { background: rgba(82,127,168,0.10); color: #7aa4c8; }
.badge.done       { background: rgba(13,158,110,0.10); color: #12c789; }
.badge.blocked    { background: rgba(220,53,69,0.10);  color: #ef5a68; }

/* Metric grid (non-table context) */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(110px,1fr)); gap: 7px; margin: 9px 0; }
.metric-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 11px 13px; text-align: center; }
.metric-value { font-size: 20px; font-weight: 700; color: var(--gold2); font-variant-numeric: tabular-nums; }
.metric-label { font-size: 10.5px; color: var(--text3); margin-top: 3px; font-weight: 500; }

/* ── Tool indicator ────────────────────────────────────────────── */
.tool-row { padding: 2px 24px; max-width: 1080px; margin: 0 auto; width: 100%; }
.tool-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--gold-dim); border: 1px solid rgba(184,130,10,0.2);
  border-radius: 20px; padding: 4px 12px;
  font-size: 11px; color: var(--gold2);
}
.tool-pill code { background: rgba(184,130,10,0.12); color: var(--gold2); padding: 0 5px; border-radius: 3px; font-size: 10.5px; }
.spin {
  width: 10px; height: 10px;
  border: 2px solid rgba(184,130,10,0.2); border-top-color: var(--gold2);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to{ transform:rotate(360deg); } }

.cursor {
  display: inline-block; width: 2px; height: 13px;
  background: var(--gold2); margin-left: 2px; vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50%{opacity:0} }

/* ── Input bar ─────────────────────────────────────────────────── */
#input-area {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 11px 20px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
#user-input {
  flex: 1; background: var(--card); border: 1px solid var(--border2);
  border-radius: 9px; padding: 10px 15px; color: var(--text);
  font-size: 13.5px; resize: none; min-height: 46px; max-height: 140px;
  font-family: inherit; line-height: 1.55; transition: border-color .12s;
}
#user-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,130,10,0.08); }
#user-input::placeholder { color: var(--text3); }

.send-btn {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  border: none; border-radius: 9px; color: #040c1a;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .12s;
  box-shadow: 0 2px 10px rgba(184,130,10,0.4);
}
.send-btn:hover { transform: scale(1.04); box-shadow: 0 4px 14px rgba(184,130,10,0.5); }
.send-btn:disabled { background: var(--card); box-shadow: none; transform: none; cursor: not-allowed; }
.send-btn svg { width: 17px; height: 17px; }

.mic-btn {
  width: 46px; height: 46px;
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 9px; color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .12s;
}
.mic-btn:hover { border-color: var(--gold); color: var(--gold); }
.mic-btn.recording { background: rgba(220,53,69,.1); border-color: var(--red); color: var(--red); animation: pulse-mic 1.1s ease-in-out infinite; }
.mic-btn svg { width: 18px; height: 18px; }
@keyframes pulse-mic { 0%,100%{box-shadow:0 0 0 0 rgba(220,53,69,.4)} 50%{box-shadow:0 0 0 8px rgba(220,53,69,0)} }

/* ── Toast ─────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
  background: var(--card2); border: 1px solid var(--border2);
  color: var(--text); padding: 7px 16px; border-radius: 8px;
  font-size: 12px; font-weight: 500; z-index: 9999;
  box-shadow: var(--shadow); transition: opacity .3s;
  pointer-events: none;
}

/* ── Reports dashboard ─────────────────────────────────────────── */
#reports-panel {
  display: none; flex-direction: column;
  flex: 1; overflow-y: auto; padding: 20px 24px; background: var(--bg);
}
.rp-grid {
  max-width: 1100px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: repeat(2,1fr); gap: 14px;
}
.rp-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px;
}
.rp-card h3 { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.rp-card .rp-sub { font-size: 10.5px; color: var(--text3); margin-bottom: 12px; font-family: monospace; }
.rp-card canvas { max-height: 200px; }
.rp-kpi-row { display: flex; gap: 8px; }
.kpi-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; }
.kpi-box .kpi-val { font-size: 22px; font-weight: 700; color: var(--gold2); font-variant-numeric: tabular-nums; }
.kpi-box .kpi-lbl { font-size: 10.5px; color: var(--text3); margin-top: 3px; }

}
</style>
</head>
<body>

<script>
/* ── State ───────────────────────────────────────────────────────── */
let history = [], streaming = false, chartCounter = 0;
let apiKey = localStorage.getItem('groq_key') || '';
const reportCharts = {};

if (apiKey) document.getElementById('api-key-input').value = apiKey;
renderWelcome();

/* ── Welcome ─────────────────────────────────────────────────────── */
function renderWelcome() {
  const w = document.getElementById('welcome');
  const t = document.getElementById('welcome-tpl');
  if (w && t) {
    w.style.cssText = 'max-width:1080px;margin:0 auto;width:100%;padding:4px 28px 32px;display:flex;flex-direction:column;align-items:center';
    w.innerHTML = t.innerHTML;
  }
}

/* ── Settings / Key ──────────────────────────────────────────────── */
function toggleSettings() {
  const p = document.getElementById('settings-panel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
}
function saveKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  localStorage.setItem('groq_key', apiKey);
  document.getElementById('settings-panel').style.display = 'none';
  toast('API key saved ✓');
}
function clearKey() {
  apiKey = '';
  localStorage.removeItem('groq_key');
  document.getElementById('api-key-input').value = '';
  toast('Key cleared — using server key ✓');
}

/* ── Toast ───────────────────────────────────────────────────────── */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 350); }, 2800);
}

/* ── Helpers ─────────────────────────────────────────────────────── */
function newChat() {
  if (streaming) return;
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div id="welcome"></div>';
  renderWelcome();
  const inp = document.getElementById('user-input');
  inp.value = ''; inp.style.height = 'auto';
}
function suggest(el) { document.getElementById('user-input').value = el.textContent.trim(); sendMessage(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function isArabic(t) { return /[؀-ۿ]/.test(t); }
function scrollBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }
function fmtNum(v) {
  if (typeof v !== 'number') v = parseFloat(String(v).replace(/,/g,''));
  if (isNaN(v)) return null;
  if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v % 1 === 0 ? v.toLocaleString() : v.toFixed(2);
}

/* ── Chart palette ───────────────────────────────────────────────── */
const PAL = ['#b8820a','#1a6db5','#0d9e6e','#6b3fa0','#c96220','#0b8a7c','#b8306a','#0e8aaa','#7a9020','#dc8435'];

/* ── Report Module builder ───────────────────────────────────────── */
let _rmChartPending = {}; // moduleId → {headers, rows}

function rmSwitch(btn, moduleId, pane) {
  const mod = document.getElementById(moduleId);
  if (!mod) return;
  mod.querySelectorAll('.rm-tab').forEach(t => t.classList.remove('active'));
  mod.querySelectorAll('.rm-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const target = mod.querySelector('[data-pane="' + pane + '"]');
  if (target) target.classList.add('active');
  // Lazy-init chart on first click
  if (pane === 'chart' && _rmChartPending[moduleId]) {
    const { headers, rows } = _rmChartPending[moduleId];
    delete _rmChartPending[moduleId];
    setTimeout(() => _initModuleChart(moduleId, headers, rows), 30);
  }
}

function _fmtAxis(v) {
  if (v >= 1e9) return (v/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return v;
}

function _initModuleChart(moduleId, headers, rows) {
  const canvas = document.getElementById('chart-canvas-' + moduleId);
  if (!canvas || typeof Chart === 'undefined') return;
  if (!rows.length) return;

  let labelCol = 0, valCols = [];
  rows.forEach(r => {
    r.forEach((v, i) => {
      if (i > 0 && !isNaN(parseFloat(String(v).replace(/,/g,'')))) {
        if (!valCols.includes(i)) valCols.push(i);
      }
    });
  });

  const labels = rows.map(r => String(r[labelCol]).slice(0, 30));
  let datasets, isSynthetic = false;

  if (valCols.length === 0) {
    // Text-only table: visualise as one equal slice per item (shows the full set)
    isSynthetic = true;
    datasets = [{
      label: 'Items',
      data: rows.map(() => 1),
      backgroundColor: rows.map((_, i) => PAL[i % PAL.length] + 'cc'),
      borderColor: rows.map((_, i) => PAL[i % PAL.length]),
      borderWidth: 1.5, hoverOffset: 8
    }];
  } else {
    datasets = valCols.slice(0, 3).map((ci, di) => ({
      label: headers[ci] || 'Value',
      data: rows.map(r => parseFloat(String(r[ci]).replace(/,/g,'')) || 0),
      backgroundColor: valCols.length === 1
        ? rows.map((_, i) => PAL[i % PAL.length] + 'cc')
        : PAL[di % PAL.length] + 'cc',
      borderColor: valCols.length === 1
        ? rows.map((_, i) => PAL[i % PAL.length])
        : PAL[di % PAL.length],
      borderWidth: 1.5, borderRadius: 5, hoverOffset: 8
    }));
  }

  // Doughnut for: synthetic/text-only, or single numeric column with ≤ 10 rows
  const useDoughnut = isSynthetic || (valCols.length === 1 && rows.length <= 10);
  const chartType   = useDoughnut ? 'doughnut' : 'bar';
  const smallFont   = rows.length > 8;

  new Chart(canvas, {
    type: chartType,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: {
          display: useDoughnut,
          position: 'right',
          labels: {
            color: '#527fa8',
            font: { size: smallFont ? 9 : 10.5, family: 'Inter' },
            padding: smallFont ? 5 : 12, boxWidth: 10
          }
        },
        tooltip: {
          backgroundColor: '#091e38', borderColor: '#1a4a70', borderWidth: 1,
          titleColor: '#c8ddf0', bodyColor: '#527fa8', padding: 8,
          callbacks: {
            label: ctx => {
              const raw = ctx.parsed.y ?? ctx.parsed;
              if (isSynthetic) return ' ' + ctx.label;
              return ' ' + Number(raw).toLocaleString();
            }
          }
        }
      },
      scales: chartType === 'bar' ? {
        x: { ticks: { color: '#2d4f6e', font: { size: 10 }, maxRotation: 35 }, grid: { color: 'rgba(16,48,78,0.6)' } },
        y: {
          ticks: { color: '#2d4f6e', font: { size: 10 }, callback: v => _fmtAxis(v) },
          grid: { color: 'rgba(16,48,78,0.6)' }, beginAtZero: true
        }
      } : {}
    }
  });
}

function buildReportModule(rawTableHtml, headers, bodyRows) {
  const moduleId = 'rm_' + (++chartCounter);
  const tblId    = 'rmtbl_' + chartCounter;

  // ── KPI pane ──
  const dateHdrRe = /date|time|تاريخ|وقت|start|end|created|deadline/i;
  const idHdrRe   = /\bid\b|_id$|\bno\.?\b|\bseq\b|\brank\b|^\s*#/i;
  const dateValRe = /^\d{4}[-\/]\d{2}[-\/]\d{2}|^\d{2}[-\/]\d{2}[-\/]\d{4}/;
  const numCols = {};
  headers.forEach((h, ci) => {
    if (dateHdrRe.test(h)) return;
    if (idHdrRe.test(h)) return;   // skip ID / sequence columns — summing IDs is meaningless
    const vals = bodyRows.map(r => String(r[ci] || '').trim());
    if (vals.some(v => dateValRe.test(v))) return;
    let sum = 0, isNum = false;
    vals.forEach(v => { const n = parseFloat(v.replace(/,/g, '')); if (!isNaN(n)) { sum += n; isNum = true; } });
    if (isNum) numCols[h] = sum;
  });

  let kpiHtml = `<div class="rm-kpi-row">
    <div class="rm-kpi"><div class="rm-kpi-val">${bodyRows.length}</div><div class="rm-kpi-lbl">Total Rows</div></div>`;
  Object.entries(numCols).slice(0, 4).forEach(([col, sum]) => {
    kpiHtml += `<div class="rm-kpi"><div class="rm-kpi-val">${fmtNum(sum)}</div><div class="rm-kpi-lbl">${col}</div></div>`;
  });
  kpiHtml += '</div>';

  // ── Table pane ──
  const thHtml = headers.map(h => `<th>${h}</th>`).join('');
  const tbHtml = bodyRows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
  const tblHtml = `<div class="rm-table-wrap"><table class="rm-table" id="${tblId}"><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>`;

  // ── Export pane ──
  const reportLabel = headers.slice(0,2).join(' · ') || 'Odoo Report';
  const waIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
  const exportHtml = `
    <div class="rm-export-grid">

/* ── Export helpers ──────────────────────────────────────────────── */
function exportRmExcel(tblId, title) {
  const tbl = document.getElementById(tblId);
  if (!tbl || typeof XLSX === 'undefined') { alert('XLSX not loaded'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.table_to_sheet(tbl), (title||'Data').slice(0,31));
  XLSX.writeFile(wb, (title||'export') + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
}
function exportRmCSV(tblId, title) {
  const tbl = document.getElementById(tblId);
  if (!tbl) return;
  const csv = Array.from(tbl.querySelectorAll('tr'))
    .map(r => Array.from(r.querySelectorAll('th,td')).map(c => '"' + c.innerText.replace(/"/g,'""') + '"').join(','))
    .join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = (title||'export') + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}
function shareRmWhatsApp(tblId, reportTitle) {
  const tbl = document.getElementById(tblId);
  if (!tbl) return;
  const rows = Array.from(tbl.querySelectorAll('tr'));
  const headers = Array.from(rows[0].querySelectorAll('th')).map(c => c.innerText.trim());
  const bodyRows = rows.slice(1).map(r => Array.from(r.querySelectorAll('td')).map(c => c.innerText.trim()));

  // Build header separator line
  const sepLine = headers.map(h => '─'.repeat(Math.max(h.length, 8))).join('─┼─');
  const headerLine = headers.join(' │ ');

  // Format each row
  const dataLines = bodyRows.map(r => r.join(' │ '));

  // Build numeric summary
  const numSums = {};
  headers.forEach((h, ci) => {
    const vals = bodyRows.map(r => parseFloat((r[ci]||'').replace(/,/g,'')));
    const valid = vals.filter(v => !isNaN(v));
    if (valid.length > 0) numSums[h] = valid.reduce((a,b) => a+b, 0);
  });
  const summaryLines = Object.entries(numSums)
    .map(([k,v]) => `  • ${k}: *${v >= 1e6 ? (v/1e6).toFixed(2)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : v.toLocaleString()}*`);

  const now = new Date().toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const title = reportTitle && reportTitle !== 'report' ? reportTitle : 'Odoo Report';

  const msg = [
    `🏗️ *${title}*`,
    `📅 ${now}  |  🔢 ${bodyRows.length} records`,
    ``,
    headerLine,
    sepLine,
    ...dataLines,
    ``,
    summaryLines.length ? `📊 *Totals:*\n${summaryLines.join('\n')}` : '',
    ``,
    `_Exported from Odoo AI Assistant_`
  ].filter(l => l !== undefined).join('\n');

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

/* ── Markdown renderer ───────────────────────────────────────────── */
function renderMD(raw, bubble) {
  const chartBlocks = [];
  const cleaned = raw.replace(/CHART_(BAR|PIE):(\{[\s\S]*?\})\n?/g, (_, type, json) => {
    const id = 'ch_' + (++chartCounter);
    chartBlocks.push({ id, type: type.toLowerCase(), json });
    return `__CHART_${id}__\n`;
  });

  let t = cleaned
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Badges
  t = t.replace(/\b(available|contracted|reserved|booked|delivered|cancelled|hold|draft|held|blocked|done)\b/gi,
    m => `<span class="badge ${m.toLowerCase()}">${m}</span>`);

  // Inline formatting
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/^#{1,3} (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^---$/gm, '<hr>');

  // Tables → Report Modules
  t = t.replace(/((?:^\|.+\n)+)/gm, block => {
    const lines = block.trim().split('\n');
    let headers = [], bodyRows = [];
    lines.forEach((row, i) => {
      if (/^\|[\s\-:|]+\|$/.test(row)) return;
      const cells = row.split('|').slice(1,-1).map(c => c.trim());
      if (i === 0) headers = cells;
      else bodyRows.push(cells);
    });
    if (!headers.length || !bodyRows.length) return block;
    return buildReportModule(block, headers, bodyRows);
  });

  // Lists
  t = t.replace(/^[\-\*•] (.+)$/gm, '<li>$1</li>');
  t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>.*?<\/li>(\n|$))+/gs, m => '<ul>' + m + '</ul>');

  t = t.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');

  // Chart placeholders
  chartBlocks.forEach(({id, type}) => {
    t = t.replace(`__CHART_${id}__`, `
      <div style="background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:14px;margin:8px 0">
        <div id="ct_${id}" style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px"></div>
        <div style="position:relative;height:220px"><canvas id="${id}"></canvas></div>
      </div>`);
  });

  return { html: t, charts: chartBlocks };
}

function applyCharts(bubble, charts) {
  charts.forEach(({id, type, json}) => {
    try {
      const cfg = JSON.parse(json);
      const titleEl = bubble.querySelector('#ct_' + id);
      if (titleEl) titleEl.textContent = cfg.title || '';
      const canvas = document.getElementById(id);
      if (!canvas) return;
      const isBar = type === 'bar';
      const ds = cfg.datasets
        ? cfg.datasets.map((ds, i) => ({
            label: ds.label, data: ds.data,
            backgroundColor: isBar ? PAL.map(c=>c+'cc') : PAL.slice(0,ds.data.length).map(c=>c+'cc'),
            borderColor: PAL, borderWidth: 1.5, borderRadius: isBar ? 5 : 0, hoverOffset: 7
          }))
        : [{
            label: cfg.title||'Value', data: cfg.data,
            backgroundColor: isBar ? PAL.slice(0,cfg.data.length).map(c=>c+'cc') : PAL.slice(0,cfg.data.length).map(c=>c+'cc'),
            borderColor: PAL, borderWidth: 1.5, borderRadius: isBar ? 5 : 0, hoverOffset: 7
          }];
      new Chart(canvas, {
        type: type === 'pie' ? 'doughnut' : 'bar',
        data: { labels: cfg.labels, datasets: ds },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: true, position: type==='pie'?'right':'top',
              labels: { color:'#527fa8', font:{size:10.5,family:'Inter'}, padding:12 }},
            tooltip: {
              backgroundColor:'#091e38', borderColor:'#1a4a70', borderWidth:1,
              titleColor:'#c8ddf0', bodyColor:'#527fa8', padding:8,
              callbacks:{ label: ctx => ' ' + Number(ctx.parsed.y ?? ctx.parsed).toLocaleString() }
            }
          },
          scales: isBar ? {
            x:{ticks:{color:'#2d4f6e',font:{size:10},maxRotation:35},grid:{color:'rgba(16,48,78,0.6)'}},
            y:{ticks:{color:'#2d4f6e',font:{size:10},callback:v=>_fmtAxis(v)},grid:{color:'rgba(16,48,78,0.6)'},beginAtZero:true}
          } : {}
        }
      });
    } catch(e) { console.warn('chart err',e); }
  });
}

/* ── Send ────────────────────────────────────────────────────────── */
async function sendMessage() {
  if (streaming) return;
  const inp  = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;
  const key = localStorage.getItem('groq_key') || '';
  streaming = true;
  document.getElementById('send-btn').disabled = true;
  inp.value = ''; inp.style.height = 'auto';
  const dir = isArabic(text) ? 'rtl' : 'ltr';
  appendMsg('user', `<span>${text.replace(/</g,'&lt;')}</span>`, dir);
  history.push({ role:'user', content: text });
  const aiBub = appendMsg('assistant', '', null);
  const cur   = document.createElement('span'); cur.className = 'cursor'; aiBub.appendChild(cur);
  let fullText = '';
  const toolRows = [];
  const timeout = setTimeout(() => {
    if (streaming) {
      cur.remove(); toolRows.forEach(r=>r.remove());
      if (!fullText) aiBub.innerHTML = '<span style="color:var(--gold)">⚠ Response timed out. Please try again.</span>';
      streaming = false; document.getElementById('send-btn').disabled = false;
    }
  }, 90000);
  try {
    const chatUrl = window.location.pathname.startsWith('/ai') ? '/ai/chat' : '/chat';
    const res = await fetch(chatUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: history, api_key: key })
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:'Unknown error'}));
      aiBub.innerHTML = `<span style="color:var(--red)">❌ ${err.error}</span>`;
      cur.remove(); clearTimeout(timeout);
      streaming = false; document.getElementById('send-btn').disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'text') {
          fullText += ev.text;
          const d = isArabic(fullText) ? 'rtl' : null;
          if (d) aiBub.setAttribute('dir', d);
          const { html } = renderMD(fullText);
          aiBub.innerHTML = html; aiBub.appendChild(cur); scrollBottom();
        } else if (ev.type === 'tool') {
          toolRows.push(appendTool(ev.name, ev.input||{}));
        } else if (ev.type === 'done') {
          toolRows.forEach(r=>r.remove()); cur.remove(); clearTimeout(timeout);
          if (fullText) {
            const { html, charts } = renderMD(fullText);
            aiBub.innerHTML = html;
            applyCharts(aiBub, charts);
            scrollBottom();
            _speakText(fullText);
          }
        }
      }
    }
  } catch(err) {
    aiBub.innerHTML = `<span style="color:var(--red)">❌ ${err.message}</span>`;
    cur.remove(); clearTimeout(timeout);
  }
  if (fullText) history.push({ role:'assistant', content: fullText });
  streaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').focus();
}

/* ── Voice input ─────────────────────────────────────────────────── */
let _recog = null, _recording = false;
function toggleVoice() {
  if (_recording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice not supported — use Chrome/Edge'); return; }
  if (!_recog) {
    _recog = new SR();
    _recog.continuous = false; _recog.interimResults = true; _recog.lang = 'ar-SA';
    _recog.onstart = () => {
      _recording = true;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('voice-bar').style.display = 'block';
      document.getElementById('user-input').value = '';
    };
    _recog.onresult = (e) => {
      let interim='',final='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) final+=t; else interim+=t;
      }
      const inp=document.getElementById('user-input');
      inp.value=final||interim; autoResize(inp);
      if(final) document.getElementById('voice-bar-text').textContent='✓ '+final;
    };
    _recog.onend = () => {
      _stopRecUI();
      const val=document.getElementById('user-input').value.trim();
      if(val && !streaming) setTimeout(()=>sendMessage(),400);
    };
    _recog.onerror = (e) => {
      _stopRecUI();
      if(e.error==='not-allowed') toast('Microphone permission denied.');
    };
  }
  try { _recog.start(); } catch(e) { toast('Mic error: '+e.message); }
}
function stopVoice() { if(_recog){ try{_recog.stop();}catch(e){} } _stopRecUI(); }
function _stopRecUI() {
  _recording=false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('voice-bar').style.display='none';
}

/* ── TTS ─────────────────────────────────────────────────────────── */
let _ttsEnabled = localStorage.getItem('tts_enabled')==='true';
(()=>{
  const btn=document.getElementById('tts-toggle-btn');
  if(btn){btn.textContent=_ttsEnabled?'🔊':'🔇';btn.classList.toggle('on',_ttsEnabled);}
})();
function toggleTTS() {
  _ttsEnabled=!_ttsEnabled;
  localStorage.setItem('tts_enabled',_ttsEnabled);
  const btn=document.getElementById('tts-toggle-btn');
  btn.textContent=_ttsEnabled?'🔊':'🔇'; btn.classList.toggle('on',_ttsEnabled);
  toast(_ttsEnabled?'🔊 Voice ON':'🔇 Voice OFF');
  if(!_ttsEnabled&&window.speechSynthesis) window.speechSynthesis.cancel();
}
function _speakText(text) {
  if(!_ttsEnabled||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/```[\s\S]*?```/g,'').replace(/CHART_\w+:\{[^}]+\}/g,'')
    .replace(/[|─+]/g,'').replace(/#+\s/g,'').replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1')
    .replace(/\n{2,}/g,'. ').replace(/\n/g,' ').trim().slice(0,600);
  if(!clean) return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang=/[؀-ۿ]/.test(clean)?'ar-SA':'en-US'; u.rate=1.05; u.pitch=1;
