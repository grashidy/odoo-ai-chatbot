<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Odoo AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ── Design tokens ─────────────────────────────────────────────────────── */
:root {
  /* Backgrounds */
  --bg:        #05101e;
  --surface:   #091828;
  --card:      #0d1f31;
  --card2:     #102340;
  --border:    #183048;
  --border2:   #1f3d5c;

  /* Brand */
  --amber:     #c9920a;
  --amber2:    #f0b429;
  --amber-dim: rgba(201,146,10,0.12);

  /* Status */
  --green:     #10b981;
  --red:       #ef4444;
  --blue:      #3b82f6;
  --indigo:    #6366f1;
  --teal:      #0d9488;
  --orange:    #f97316;
  --purple:    #7c3aed;
  --pink:      #db2777;
  --cyan:      #06b6d4;

  /* Text */
  --text:      #dde9f4;
  --text2:     #6b90b4;
  --text3:     #3a5878;

  /* Misc */
  --radius:    12px;
  --shadow:    0 4px 28px rgba(0,0,0,0.5);
  --glow-amber: 0 0 20px rgba(201,146,10,0.2);
}

/* ── Reset ────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Cairo', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ────────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,146,10,0.3), transparent);
}

.logo-wrap {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #c9920a 0%, #f0b429 100%);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  box-shadow: 0 0 14px rgba(201,146,10,0.4);
  flex-shrink: 0;
}
.header-brand { line-height: 1.2; }
.header-brand h1 { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.header-brand p  { font-size: 10.5px; color: var(--text3); font-weight: 400; letter-spacing: 0.2px; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 20px; padding: 4px 11px;
  font-size: 11.5px; color: var(--green); font-weight: 500;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 5px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

.hdr-btn {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 7px; padding: 6px 12px;
  color: var(--text2); font-size: 12.5px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: all 0.15s; font-family: inherit; text-decoration: none;
  white-space: nowrap;
}
.hdr-btn:hover { border-color: var(--amber); color: var(--amber2); }
.hdr-btn.new:hover { border-color: var(--green); color: var(--green); }
.tab-btn.active {
  border-color: var(--amber) !important;
  color: var(--amber2) !important;
  background: var(--amber-dim) !important;
}

/* ── Settings ──────────────────────────────────────────────────────────── */
#settings-panel {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 9px 24px; display: none; align-items: center; gap: 10px; flex-shrink: 0;
}
#settings-panel label { font-size: 12.5px; color: var(--text2); white-space: nowrap; }
#api-key-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 7px; padding: 7px 13px; color: var(--text);
  font-size: 12.5px; font-family: monospace;
}
#api-key-input:focus { outline: none; border-color: var(--amber); }
.btn-save {
  background: var(--amber); color: #07111f; border: none;
  padding: 7px 16px; border-radius: 7px; cursor: pointer;
  font-size: 12.5px; font-weight: 700; font-family: inherit;
  transition: background 0.15s;
}
.btn-save:hover { background: var(--amber2); }

/* ── TTS button ────────────────────────────────────────────────────────── */
.tts-btn {
  background: none; border: 1px solid var(--border2); border-radius: 7px;
  color: var(--text3); cursor: pointer; padding: 5px 9px; font-size: 17px;
  transition: all .15s;
}
.tts-btn.on { border-color: var(--amber); color: var(--amber); }
.tts-btn:hover { border-color: var(--amber); color: var(--amber); }

/* ── Messages ──────────────────────────────────────────────────────────── */
#messages {
  flex: 1; overflow-y: auto; padding: 24px 0;
  display: flex; flex-direction: column; gap: 0; scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Welcome / Home ────────────────────────────────────────────────────── */
#welcome {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 32px 36px; max-width: 1040px; margin: 0 auto; width: 100%;
}

.welcome-hero {
  text-align: center; margin-bottom: 28px;
}
.welcome-hero-icon {
  width: 68px; height: 68px;
  background: linear-gradient(135deg, #0d1f31 0%, #183048 50%, #1f3d5c 100%);
  border: 1px solid rgba(201,146,10,0.35);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin: 0 auto 18px;
  box-shadow: var(--glow-amber);
}
.welcome-hero h2 {
  font-size: 26px; font-weight: 700; color: var(--text);
  letter-spacing: -0.5px; margin-bottom: 8px;
}
.welcome-hero p {
  font-size: 14px; color: var(--text2); line-height: 1.65;
  max-width: 520px; margin: 0 auto;
}
.welcome-hero .ar-sub {
  font-family: 'Cairo', sans-serif; direction: rtl;
  font-size: 13px; color: var(--text3); margin-top: 5px;
}

/* ── Category grid ─────────────────────────────────────────────────────── */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px; width: 100%; margin-top: 4px;
}

/* Card accent bar at top */
.cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  overflow: hidden;
}
.cat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--cat-color, var(--amber));
  opacity: 0.7;
  transition: opacity 0.15s;
}
.cat-card:hover { border-color: var(--border2); background: var(--card2); }
.cat-card:hover::before { opacity: 1; }

/* Per-category accent colors */
.cat-card.c-re     { --cat-color: #3b82f6; }
.cat-card.c-boq    { --cat-color: #c9920a; }
.cat-card.c-sub    { --cat-color: #f0b429; }
.cat-card.c-pay    { --cat-color: #10b981; }
.cat-card.c-plan   { --cat-color: #0d9488; }
.cat-card.c-po     { --cat-color: #7c3aed; }
.cat-card.c-hr     { --cat-color: #db2777; }

.cat-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 13px;
}
.cat-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--cat-color, var(--amber));
}

.cat-title { font-size: 13.5px; font-weight: 700; color: var(--text); letter-spacing: 0.1px; }
.cat-sub   { font-size: 11px; color: var(--text3); margin-top: 2px; line-height: 1.4; }

.suggestion {
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 11px;
  font-size: 12px; color: var(--text2);
  cursor: pointer; margin-bottom: 6px;
  transition: all 0.12s; line-height: 1.4;
  display: block; text-align: left;
}
.suggestion:last-child { margin-bottom: 0; }
.suggestion:hover {
  border-color: var(--cat-color, var(--amber));
  color: var(--text);
  background: rgba(255,255,255,0.05);
  transform: translateX(2px);
}
[dir="rtl"] .suggestion:hover { transform: translateX(-2px); }
.suggestion.ar { font-family: 'Cairo', sans-serif; text-align: right; direction: rtl; }

/* ── Chat messages ─────────────────────────────────────────────────────── */
.msg-row {
  padding: 4px 28px; display: flex; gap: 12px;
  max-width: 1040px; margin: 0 auto; width: 100%;
}
.msg-row.user      { flex-direction: row-reverse; }
.msg-row.assistant { flex-direction: row; }

.avatar {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; margin-top: 7px;
}
.avatar.user-av { background: linear-gradient(135deg,#1e3a55,#0d2035); border: 1px solid var(--border2); }
.avatar.ai-av   { background: linear-gradient(135deg,#c9920a,#f0b429); box-shadow: 0 0 10px rgba(201,146,10,0.35); }

.bubble {
  max-width: 800px; padding: 13px 17px; border-radius: 13px;
  font-size: 13.5px; line-height: 1.75; word-break: break-word;
}
.msg-row.user .bubble {
  background: linear-gradient(135deg, #1a3a6e, #1f4a8a);
  color: #dde9f4; border-radius: 13px 4px 13px 13px;
  box-shadow: 0 4px 14px rgba(31,74,138,0.35);
}
.msg-row.assistant .bubble {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px 13px 13px 13px;
  box-shadow: var(--shadow);
}

/* ── Bubble content formatting ──────────────────────────────────────────── */
.bubble h3 {
  font-size: 14.5px; font-weight: 700; color: var(--amber2);
  margin: 14px 0 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.bubble h3:first-child { margin-top: 0; }
.bubble strong { color: #c8dff0; font-weight: 600; }
.bubble em     { color: var(--amber2); font-style: normal; font-weight: 500; }
.bubble code   {
  background: rgba(201,146,10,0.1); color: var(--amber2);
  padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px;
}

/* Tables */
.bubble table {
  width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12.5px;
  border-radius: 8px; overflow: hidden;
}
.bubble thead tr { background: rgba(201,146,10,0.12); }
.bubble thead th {
  padding: 9px 13px; text-align: left; color: var(--amber2);
  font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border2);
}
.bubble tbody tr { border-bottom: 1px solid rgba(24,48,72,0.8); }
.bubble tbody tr:last-child { border-bottom: none; }
.bubble tbody tr:hover { background: rgba(201,146,10,0.05); }
.bubble tbody td { padding: 8px 13px; color: var(--text); }

/* Lists */
.bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
.bubble li { margin-bottom: 5px; color: var(--text); }
.bubble ul li::marker { color: var(--amber); }

.bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

/* Status badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 11px;
  font-size: 11px; font-weight: 600;
}
.badge.available  { background: rgba(16,185,129,0.12); color: #34d399; }
.badge.contracted { background: rgba(245,158,11,0.12); color: #fbbf24; }
.badge.reserved   { background: rgba(59,130,246,0.12); color: #60a5fa; }
.badge.booked     { background: rgba(139,92,246,0.12); color: #a78bfa; }
.badge.delivered  { background: rgba(20,184,166,0.12); color: #2dd4bf; }
.badge.cancelled  { background: rgba(239,68,68,0.12);  color: #f87171; }
.badge.hold,
.badge.held,
.badge.draft      { background: rgba(156,163,175,0.12);color: #9ca3af; }
.badge.blocked    { background: rgba(239,68,68,0.12);  color: #f87171; }

/* Metric cards */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 9px; margin: 11px 0; }
.metric-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; padding: 13px 15px; text-align: center; }
.metric-value { font-size: 22px; font-weight: 700; color: var(--amber2); line-height: 1; }
.metric-label { font-size: 11px; color: var(--text3); margin-top: 4px; font-weight: 500; }

/* ── Tool indicator ────────────────────────────────────────────────────── */
.tool-row { padding: 3px 28px; max-width: 1040px; margin: 0 auto; width: 100%; }
.tool-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--amber-dim); border: 1px solid rgba(201,146,10,0.2);
  border-radius: 20px; padding: 5px 13px;
  font-size: 11.5px; color: var(--amber2);
}
.spin {
  width: 11px; height: 11px;
  border: 2px solid rgba(201,146,10,0.25); border-top-color: var(--amber2);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.cursor {
  display: inline-block; width: 2px; height: 14px;
  background: var(--amber2); margin-left: 3px; vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* RTL */
.bubble[dir="rtl"] {
  direction: rtl; text-align: right;
  font-family: 'Cairo', 'Inter', sans-serif;
}
.bubble[dir="rtl"] thead th { text-align: right; }
.bubble[dir="rtl"] ul, .bubble[dir="rtl"] ol { padding-right: 20px; padding-left: 0; }

/* ── Input area ────────────────────────────────────────────────────────── */
#input-area {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 13px 24px; display: flex; gap: 9px; align-items: flex-end; flex-shrink: 0;
}
#user-input {
  flex: 1; background: var(--card); border: 1px solid var(--border2);
  border-radius: 11px; padding: 12px 17px; color: var(--text);
  font-size: 13.5px; resize: none; min-height: 48px; max-height: 150px;
  font-family: inherit; line-height: 1.55; transition: border-color 0.15s;
}
#user-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(201,146,10,0.08); }
#user-input::placeholder { color: var(--text3); }

.send-btn {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #c9920a, #f0b429);
  border: none; border-radius: 11px; color: #07111f;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s;
  box-shadow: 0 3px 12px rgba(201,146,10,0.4);
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 5px 16px rgba(201,146,10,0.5); }
.send-btn:disabled { background: var(--card); box-shadow: none; transform: none; cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; }

.mic-btn {
  width: 48px; height: 48px;
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 11px; color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s;
}
.mic-btn:hover { border-color: var(--amber); color: var(--amber); }
.mic-btn.recording {
  background: rgba(239,68,68,.12); border-color: #ef4444; color: #ef4444;
  animation: pulse-mic 1.1s ease-in-out infinite;
}
.mic-btn svg { width: 19px; height: 19px; }
@keyframes pulse-mic {
  0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
  50%      { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}

/* Toast */
.toast {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--border2);
  color: var(--text); padding: 8px 18px; border-radius: 9px;
  font-size: 12.5px; font-weight: 500; z-index: 9999;
  box-shadow: var(--shadow); transition: opacity 0.4s;
}

/* ── Charts ────────────────────────────────────────────────────────────── */
.chart-wrap {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 11px; padding: 18px 18px 12px; margin: 11px 0;
}
.chart-title {
  font-size: 12.5px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 13px;
  display: flex; align-items: center; gap: 7px;
}
.chart-title::before { content:'📊'; font-size: 14px; }
.chart-canvas-wrap { position: relative; height: 250px; }

/* ── Table KPI / export ────────────────────────────────────────────────── */
.tbl-wrap { margin: 11px 0; }
.tbl-kpi-row { display: flex; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
.tbl-kpi {
  background: var(--amber-dim); border: 1px solid rgba(201,146,10,0.25);
  border-radius: 7px; padding: 9px 14px; min-width: 90px;
}
.tbl-kpi .tk-val { font-size: 18px; font-weight: 700; color: var(--amber2); }
.tbl-kpi .tk-lbl { font-size: 11px; font-weight: 500; color: var(--amber); margin-top: 2px; letter-spacing: 0.2px; }
.tbl-actions { display: flex; gap: 7px; margin-top: 7px; }
.btn-export {
  background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25);
  color: #10b981; border-radius: 5px; padding: 4px 11px;
  font-size: 11px; cursor: pointer; transition: all .15s;
}
.btn-export:hover { background: rgba(16,185,129,0.18); }

/* WhatsApp share */
.wa-share-btn {
  display: flex; align-items: center; gap: 5px;
  background: rgba(37,211,102,0.08); border: 1px solid rgba(37,211,102,0.25);
  color: #25d366; border-radius: 5px; padding: 4px 10px;
  font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.wa-share-btn:hover { background: rgba(37,211,102,0.16); }

/* ── Reports panel ─────────────────────────────────────────────────────── */
.report-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
}
.report-card h3 { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.report-card .report-sub { font-size: 11px; color: var(--text3); margin-bottom: 14px; }
.report-card canvas { max-height: 210px; }
.report-kpi-row { display: flex; gap: 10px; }
.kpi-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 13px; text-align: center; }
.kpi-box .kpi-val { font-size: 24px; font-weight: 700; color: var(--amber2); }
.kpi-box .kpi-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* ── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 680px) {
  .category-grid { grid-template-columns: 1fr; }
  #messages { padding: 14px 0; }
  .msg-row { padding: 4px 12px; }
  #input-area { padding: 10px 12px; }
  header { padding: 0 14px; }
  .status-pill span { display: none; }
  #welcome { padding: 6px 14px 28px; }
  .hdr-btn span { display: none; }
}
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header>
  <div class="logo-wrap">🏗️</div>
  <div class="header-brand">
    <h1>Odoo AI Assistant</h1>
    <p>Real Estate · Construction · HR · Procurement</p>
  </div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>Live · Odoo 18</span>
    </div>
    <button class="hdr-btn tab-btn active" id="tab-chat" onclick="switchTab('chat')">💬 Chat</button>
    <button class="hdr-btn tab-btn" id="tab-reports" onclick="switchTab('reports')">📊 Reports</button>
    <a href="/upload-boq" class="hdr-btn" style="text-decoration:none">📥 Import BOQ</a>
    <button class="tts-btn" id="tts-toggle-btn" onclick="toggleTTS()" title="تشغيل/إيقاف قراءة الردود">🔇</button>
    <button class="hdr-btn new" onclick="newChat()">✚ New Chat</button>
    <button class="hdr-btn" onclick="toggleSettings()">⚙ Settings</button>
  </div>
</header>

<!-- ── Settings panel ─────────────────────────────────────────────────── -->
<div id="settings-panel">
  <label>Groq API Key:</label>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let history = [];
let streaming = false;
let apiKey = localStorage.getItem('groq_key') || '';
let chartCounter = 0;

if (apiKey) document.getElementById('api-key-input').value = apiKey;
renderWelcome();

// ── Welcome ───────────────────────────────────────────────────────────────────
function renderWelcome() {
  const tpl = document.getElementById('welcome-tpl');
  const w   = document.getElementById('welcome');
  if (w && tpl) w.innerHTML = tpl.innerHTML;
}

// ── Settings ──────────────────────────────────────────────────────────────────
function toggleSettings() {
  const p = document.getElementById('settings-panel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
}
function saveKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  localStorage.setItem('groq_key', apiKey);
  document.getElementById('settings-panel').style.display = 'none';
  toast('API key saved ✓');
}
function toast(msg, color) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if (color) t.style.borderColor = color;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 3000);
}

// ── New Chat ──────────────────────────────────────────────────────────────────
function newChat() {
  if (streaming) return;
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div id="welcome" style="display:flex;flex-direction:column;align-items:center;padding:8px 32px 36px;max-width:1040px;margin:0 auto;width:100%"></div>';
  renderWelcome();
  document.getElementById('user-input').value = '';
  document.getElementById('user-input').style.height = 'auto';
}

function suggest(el) { document.getElementById('user-input').value = el.textContent.trim(); sendMessage(); }
function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,150)+'px'; }
function isArabic(t) { return /[؀-ۿ]/.test(t); }
function scrollBottom() { const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }

// ── Chart colours ─────────────────────────────────────────────────────────────
const PALETTE = [
  '#c9920a','#10b981','#3b82f6','#7c3aed','#f97316',
  '#0d9488','#db2777','#06b6d4','#84cc16','#f0b429'
];

// ── Chart rendering ───────────────────────────────────────────────────────────
function buildChart(type, cfg, containerId) {
  const canvas = document.getElementById(containerId);
  if (!canvas) return;
  const isBar = type === 'bar';
  const datasets = cfg.datasets
    ? cfg.datasets.map((ds, i) => ({
        label: ds.label, data: ds.data,
        backgroundColor: isBar ? PALETTE.map(c => c+'cc') : PALETTE.slice(0,ds.data.length).map(c=>c+'dd'),
        borderColor: PALETTE.map(c=>c), borderWidth: isBar ? 1.5 : 2,
        borderRadius: isBar ? 6 : 0, hoverOffset: 8
      }))
    : [{
        label: cfg.title || 'Count', data: cfg.data,
        backgroundColor: isBar ? PALETTE.slice(0,cfg.data.length).map(c=>c+'cc') : PALETTE.slice(0,cfg.data.length).map(c=>c+'dd'),
        borderColor: PALETTE.slice(0,cfg.data.length), borderWidth: isBar ? 1.5 : 2,
        borderRadius: isBar ? 6 : 0, hoverOffset: 8
      }];
  new Chart(canvas, {
    type: type==='pie' ? 'doughnut' : 'bar', data: { labels: cfg.labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: type==='pie' ? 'right' : 'top',
          labels: { color:'#6b90b4', font:{ size:11, family:'Inter' }, padding: 14 } },
        tooltip: {
          backgroundColor:'#0d1f31', borderColor:'#183048', borderWidth:1,
          titleColor:'#dde9f4', bodyColor:'#6b90b4', padding:9,
          callbacks: { label: ctx => ' ' + ctx.parsed.toLocaleString() }
        }
      },
      scales: isBar ? {
        x: { ticks: { color:'#6b90b4', font:{size:10}, maxRotation:35 }, grid:{color:'rgba(24,48,72,0.5)'} },
        y: { ticks: { color:'#6b90b4', font:{size:10} }, grid:{color:'rgba(24,48,72,0.5)'}, beginAtZero:true }
      } : {}
    }
  });
}

// ── Markdown renderer ─────────────────────────────────────────────────────────
function renderMD(raw, bubble) {
  const chartBlocks = [];
  const cleaned = raw.replace(/CHART_(BAR|PIE):(\{[\s\S]*?\})\n?/g, (_, type, json) => {
    const id = 'chart-' + (++chartCounter);
    chartBlocks.push({ id, type: type.toLowerCase(), json });
    return `__CHART_PLACEHOLDER_${id}__\n`;
  });
  let t = cleaned.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t = t.replace(/\b(available|contracted|reserved|booked|delivered|cancelled|hold|draft|held|blocked)\b/gi, m =>
    `<span class="badge ${m.toLowerCase()}">${m}</span>`);
  t = t.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^# (.+)$/gm,  '<h3>$1</h3>');
  t = t.replace(/^---$/gm,'<hr>');
  // Tables
  t = t.replace(/((?:^\|.+\n)+)/gm, block => {
    const rows = block.trim().split('\n');
    const tblId = 'tbl_' + Math.random().toString(36).slice(2,8);
    let headers = [], bodyRows = [], inBody = false;
    let tableHtml = '<table id="' + tblId + '">';
    rows.forEach((row, i) => {
      if (/^\|[\s\-:|]+\|/.test(row)) { if (!inBody){tableHtml+='<tbody>';inBody=true;} return; }
      const cells = row.split('|').slice(1,-1).map(c=>c.trim());
      if (i === 0) {
        headers = cells;
        tableHtml += '<thead><tr>' + cells.map(c=>`<th>${c}</th>`).join('') + '</tr></thead>';
      } else {
        if (!inBody){tableHtml+='<tbody>';inBody=true;}
        bodyRows.push(cells);
        tableHtml += '<tr>' + cells.map(c=>`<td>${c}</td>`).join('') + '</tr>';
      }
    });
    tableHtml += '</tbody></table>';
    const numCols = {};
    const dateHeaderRe = /date|time|تاريخ|وقت|start|end|created|deadline/i;
    const dateValueRe  = /^\d{4}[-\/\.]\d{2}[-\/\.]\d{2}|^\d{2}[-\/\.]\d{2}[-\/\.]\d{4}/;
    headers.forEach((h,ci) => {
      if (dateHeaderRe.test(h)) return;
      const vals = bodyRows.map(r => (r[ci]||'').trim());
      if (vals.some(v => dateValueRe.test(v))) return;
      let sum = 0; let isNum = false;
      vals.forEach(v => { const n=parseFloat(v.replace(/,/g,'')); if(!isNaN(n)){sum+=n;isNum=true;} });
      if (isNum) numCols[h] = sum;
    });
    let kpiHtml = `<div class="tbl-kpi-row">`;
    kpiHtml += `<div class="tbl-kpi"><div class="tk-val">${bodyRows.length}</div><div class="tk-lbl">Total Rows</div></div>`;
    Object.entries(numCols).forEach(([col, sum]) => {
      const disp = sum>=1e6?(sum/1e6).toFixed(1)+'M':sum>=1e3?(sum/1e3).toFixed(1)+'K':sum.toFixed(0);
      kpiHtml += `<div class="tbl-kpi"><div class="tk-val">${disp}</div><div class="tk-lbl">${col}</div></div>`;
    });
    kpiHtml += `</div>`;
    const tblTitle = headers.join('_') || 'table';
    const actionsHtml = `<div class="tbl-actions">
      <button class="btn-export" onclick="exportTableExcel('${tblId}','${tblTitle}')">⬇ Excel</button>
      <button class="btn-export" onclick="exportTableCSV('${tblId}','${tblTitle}')" style="border-color:rgba(99,102,241,0.3);color:#818cf8;background:rgba(99,102,241,0.08)">⬇ CSV</button>
      <button class="wa-share-btn" onclick="shareTableWhatsApp('${tblId}','${tblTitle}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </button>
    </div>`;
    return `<div class="tbl-wrap">${kpiHtml}${tableHtml}${actionsHtml}</div>`;
  });
  t = t.replace(/^[\-\*•] (.+)$/gm,'<li>$1</li>');
  t = t.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>.*?<\/li>(\n|$))+/gs, m => '<ul>' + m + '</ul>');
  t = t.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
  chartBlocks.forEach(({id, type}) => {
    t = t.replace(`__CHART_PLACEHOLDER_${id}__`, `
      <div class="chart-wrap">
        <div class="chart-title" id="title-${id}"></div>
        <div class="chart-canvas-wrap"><canvas id="${id}"></canvas></div>
      </div>`);
  });
  return { html: t, charts: chartBlocks };
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function removeWelcome() { const w=document.getElementById('welcome'); if(w)w.remove(); }

function appendMsg(role, content, dir) {
  removeWelcome();
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row ' + role;
  const avCls = role==='user' ? 'user-av' : 'ai-av';
  const emoji  = role==='user' ? '👤' : '🏗️';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (dir) bub.setAttribute('dir', dir);
  if (typeof content === 'string') bub.innerHTML = content;
  row.innerHTML = `<div class="avatar ${avCls}">${emoji}</div>`;
  row.appendChild(bub);
  msgs.appendChild(row);
  scrollBottom();
  return bub;
}

function shareTableWhatsApp(tblId, title) {
  const tbl = document.getElementById(tblId);
  if (!tbl) return;
  const rows = Array.from(tbl.querySelectorAll('tr'));
  const lines = rows.map(r => Array.from(r.querySelectorAll('th,td')).map(c=>c.innerText.trim()).join(' | '));
  const heading = (title||'Data').replace(/_/g,' ');
  window.open('https://wa.me/?text=' + encodeURIComponent('*'+heading+'*\n'+lines.join('\n')), '_blank');
}

function applyCharts(bubble, charts) {
  charts.forEach(({id, type, json}) => {
    try {
      const cfg = JSON.parse(json);
      const titleEl = bubble.querySelector('#title-' + id);
      if (titleEl) titleEl.textContent = cfg.title || '';
      setTimeout(() => buildChart(type, cfg, id), 50);
    } catch(e) { console.warn('Chart parse error:', e); }
  });
}

function appendTool(name, input) {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'tool-row';
  const model = (input.model||input.groupby) ? ` <code style="font-size:11px;background:rgba(201,146,10,0.1);color:var(--amber2);padding:1px 5px;border-radius:3px">${input.model||''}</code>` : '';
  row.innerHTML = `<div class="tool-pill"><div class="spin"></div><span>Querying Odoo${model}</span></div>`;
  msgs.appendChild(row);
  scrollBottom();
  return row;
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  if (streaming) return;
  const inp  = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;
  const key = apiKey || localStorage.getItem('groq_key') || '';
  if (!key) { toggleSettings(); toast('Enter your Groq API key first'); return; }
  streaming = true;
  document.getElementById('send-btn').disabled = true;
  inp.value = ''; inp.style.height = 'auto';
  const dir = isArabic(text) ? 'rtl' : 'ltr';
  appendMsg('user', `<span>${text.replace(/</g,'&lt;')}</span>`, dir);
  history.push({ role:'user', content: text });
  const aiBub = appendMsg('assistant', '', null);
  const cur   = document.createElement('span');
  cur.className = 'cursor';
  aiBub.appendChild(cur);
  let fullText = '';
  const toolRows = [];
  const timeout = setTimeout(() => {
    if (streaming) {
      cur.remove(); toolRows.forEach(r=>r.remove());
      if (!fullText) aiBub.innerHTML = '<span style="color:var(--amber)">⚠ Response timed out. Please try again.</span>';
      streaming = false; document.getElementById('send-btn').disabled = false;
    }
  }, 90000);
  try {
    const chatUrl = window.location.pathname.startsWith('/ai') ? '/ai/chat' : '/chat';
    const res = await fetch(chatUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, api_key: key })
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:'Unknown error'}));
      aiBub.innerHTML = `<span style="color:var(--red)">❌ ${err.error}</span>`;
      cur.remove(); clearTimeout(timeout);
      streaming = false; document.getElementById('send-btn').disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'text') {
          fullText += ev.text;
          const d = isArabic(fullText) ? 'rtl' : null;
          if (d) aiBub.setAttribute('dir', d);
          const { html } = renderMD(fullText);
          aiBub.innerHTML = html; aiBub.appendChild(cur); scrollBottom();
        } else if (ev.type === 'tool') {
          toolRows.push(appendTool(ev.name, ev.input || {}));
        } else if (ev.type === 'done') {
          toolRows.forEach(r=>r.remove()); cur.remove(); clearTimeout(timeout);
          if (fullText) {
            const { html, charts } = renderMD(fullText);
            aiBub.innerHTML = html; applyCharts(aiBub, charts); scrollBottom();
            _speakText(fullText);
          }
        }
      }
    }
  } catch(err) {
    aiBub.innerHTML = `<span style="color:var(--red)">❌ ${err.message}</span>`;
    cur.remove(); clearTimeout(timeout);
  }
  if (fullText) history.push({ role:'assistant', content: fullText });
  streaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').focus();
}

// ── Excel / CSV export ────────────────────────────────────────────────────────
function _exportFilename(title, ext) {
  const safe = (title||'odoo_export').replace(/[\\/:"*?<>|]/g,'').trim().replace(/\s+/g,'_');
  return safe + '_' + new Date().toISOString().slice(0,10) + '.' + ext;
}
function exportTableExcel(tblId, title) {
  const tbl = document.getElementById(tblId);
  if (!tbl || typeof XLSX==='undefined') { alert('SheetJS not loaded'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.table_to_sheet(tbl);
  XLSX.utils.book_append_sheet(wb, ws, (title||'Data').slice(0,31));
  XLSX.writeFile(wb, _exportFilename(title,'xlsx'));
}
function exportTableCSV(tblId, title) {
  const tbl = document.getElementById(tblId);
  if (!tbl) return;
  const rows = Array.from(tbl.querySelectorAll('tr'));
  const csv = rows.map(r => Array.from(r.querySelectorAll('th,td')).map(c=>'"'+c.innerText.replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = _exportFilename(title,'csv'); a.click();
}

// ── Tab switching ──────────────────────────────────────────────────────────────
const reportCharts = {};
function switchTab(tab) {
  const isChat = tab === 'chat';
  document.getElementById('messages').style.display   = isChat ? '' : 'none';
  document.getElementById('input-area').style.display = isChat ? '' : 'none';
  document.getElementById('reports-panel').style.display = isChat ? 'none' : 'flex';
  document.getElementById('reports-panel').style.flexDirection = 'column';
  document.getElementById('tab-chat').classList.toggle('active', isChat);
  document.getElementById('tab-reports').classList.toggle('active', !isChat);
  if (!isChat) loadReports();
}

// ── Reports ───────────────────────────────────────────────────────────────────
async function loadReports() {
  const grid = document.getElementById('reports-grid');
  const loading = document.getElementById('reports-loading');
  loading.style.display = 'block'; grid.style.display = 'none';
  grid.innerHTML = ''; Object.values(reportCharts).forEach(c => c.destroy());
  const base = window.location.pathname.startsWith('/ai') ? '/ai' : '';
  try {
    const resp = await fetch(base + '/reports-data');
    const d = await resp.json();
    loading.style.display = 'none'; grid.style.display = 'grid';
    const totalUnits  = (d.units_by_state||[]).reduce((s,r)=>s+r.count,0);
    const totalEmp    = (d.emp_by_dept   ||[]).reduce((s,r)=>s+r.count,0);
    const totalAdv    = (d.adv_by_project||[]).reduce((s,r)=>s+(r.amount||0),0);
    const totalPO     = (d.po_by_vendor  ||[]).reduce((s,r)=>s+(r.amount||0),0);
    const kpiCard = document.createElement('div');
    kpiCard.className = 'report-card';
    kpiCard.style.gridColumn = '1 / -1';
    kpiCard.innerHTML = `
      <h3>Key Numbers</h3><div class="report-sub">Live from Odoo — Construction · Real Estate · HR</div>
      <div class="report-kpi-row">
        <div class="kpi-box"><div class="kpi-val">${totalUnits.toLocaleString()}</div><div class="kpi-lbl">Total RE Units</div></div>
        <div class="kpi-box"><div class="kpi-val">${totalEmp.toLocaleString()}</div><div class="kpi-lbl">Employees</div></div>
        <div class="kpi-box"><div class="kpi-val">${fmt(totalAdv)}</div><div class="kpi-lbl">Advance Payments (EGP)</div></div>
        <div class="kpi-box"><div class="kpi-val">${fmt(totalPO)}</div><div class="kpi-lbl">PO Total Confirmed (EGP)</div></div>
      </div>`;
    grid.appendChild(kpiCard);
    const charts = [
      { title:'RE Units by State',             sub:'Real Estate',        data:d.units_by_state,      type:'doughnut',key:'label',val:'count' },
      { title:'Advance Payments by Project',   sub:'Construction (EGP)', data:d.adv_by_project,      type:'bar',     key:'label',val:'amount'},
      { title:'Advance Payments by State',     sub:'Construction',       data:d.adv_by_state,        type:'doughnut',key:'label',val:'count' },
      { title:'Client BOQ Value by Project',   sub:'project.detailed.item.line (EGP)',data:d.boq_detail_by_project,type:'bar',key:'label',val:'amount'},
      { title:'Subcontract BOQ by Project',    sub:'Construction',       data:d.boq_by_project,      type:'bar',     key:'label',val:'amount'},
      { title:'Top Vendors by PO Value',       sub:'Purchases (EGP)',    data:d.po_by_vendor,        type:'bar',     key:'label',val:'amount'},
      { title:'Employees by Department',       sub:'HR',                 data:d.emp_by_dept,         type:'bar',     key:'label',val:'count' },
      { title:'Construction Plan by State',    sub:'main.project.plan.operation',data:d.plan_by_state,type:'doughnut',key:'label',val:'count'},
    ];
    const COLORS = ['#c9920a','#10b981','#3b82f6','#7c3aed','#f97316','#0d9488','#db2777','#06b6d4','#84cc16','#f0b429'];
    charts.forEach((cfg, idx) => {
      if (!cfg.data || cfg.data.error || !cfg.data.length) return;
      const card = document.createElement('div');
      card.className = 'report-card';
      const cid = 'rc'+idx, tid = 'rt'+idx;
      const thRow = `<tr><th>${cfg.key}</th><th>${cfg.val}</th></tr>`;
      const tbRows = cfg.data.map(r=>`<tr><td>${r[cfg.key]||''}</td><td>${r[cfg.val]||0}</td></tr>`).join('');
      card.innerHTML = `<h3>${cfg.title}</h3><div class="report-sub">${cfg.sub}</div>
        <canvas id="${cid}"></canvas>
        <table id="${tid}" style="display:none"><thead>${thRow}</thead><tbody>${tbRows}</tbody></table>
        <div class="tbl-actions" style="margin-top:10px">
          <button class="btn-export" onclick="exportTableExcel('${tid}','${cfg.title}')">⬇ Excel</button>
          <button class="btn-export" onclick="exportTableCSV('${tid}','${cfg.title}')" style="border-color:rgba(99,102,241,0.3);color:#818cf8;background:rgba(99,102,241,0.08)">⬇ CSV</button>
        </div>`;
      grid.appendChild(card);
      reportCharts[cid] = new Chart(document.getElementById(cid), {
        type: cfg.type,
        data: { labels: cfg.data.map(r=>r[cfg.key]), datasets: [{
          data: cfg.data.map(r=>r[cfg.val]||0),
          backgroundColor: cfg.type==='doughnut' ? COLORS : COLORS[idx%COLORS.length],
          borderRadius: cfg.type==='bar' ? 6 : 0, borderWidth: 0,
        }]},
        options: {
          responsive: true,
          plugins: {
            legend: { display: cfg.type==='doughnut', labels:{color:'#6b90b4',boxWidth:12,font:{size:11}} },
            tooltip: { callbacks: { label: ctx => {
              const v = ctx.parsed.y ?? ctx.parsed;
              return ' ' + (cfg.val==='amount' ? fmt(v)+' EGP' : v.toLocaleString());
            }}}
          },
          scales: cfg.type==='bar' ? {
            x:{ticks:{color:'#3a5878',font:{size:10},maxRotation:30},grid:{color:'rgba(24,48,72,0.4)'}},
            y:{ticks:{color:'#3a5878',font:{size:10},callback:v=>cfg.val==='amount'?fmt(v):v},grid:{color:'rgba(24,48,72,0.4)'}}
          } : {}
        }
      });
    });
  } catch(e) { loading.textContent = '❌ Failed to load: '+e.message; loading.style.display='block'; }
}

function fmt(v) {
  if (v>=1_000_000) return (v/1_000_000).toFixed(1)+'M';
  if (v>=1_000)     return (v/1_000).toFixed(1)+'K';
  return Math.round(v).toLocaleString();
}

// ── Voice Input ───────────────────────────────────────────────────────────────
let _recog = null, _recording = false;
function _buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false; r.interimResults = true; r.maxAlternatives = 1; r.lang = 'ar-SA';
  r.onstart = () => {
    _recording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('voice-bar').style.display = 'block';
    document.getElementById('voice-bar-text').textContent = 'جاري الاستماع… تكلم الآن / Listening…';
    document.getElementById('user-input').value = '';
    document.getElementById('user-input').placeholder = '🎤 …';
  };
  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i=e.resultIndex; i<e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    const inp = document.getElementById('user-input');
    inp.value = final || interim; autoResize(inp);
    if (final) document.getElementById('voice-bar-text').textContent = '✓ ' + final;
  };
  r.onend = () => {
    _stopRecordingUI();
    const val = document.getElementById('user-input').value.trim();
    if (val && !streaming) setTimeout(() => sendMessage(), 400);
  };
  r.onerror = (e) => {
    _stopRecordingUI();
    if (e.error==='not-allowed') toast('Microphone permission denied.');
    else if (e.error!=='no-speech') toast('Voice error: '+e.error);
  };
  return r;
}
function toggleVoice() {
  if (_recording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice input not supported. Use Chrome or Edge.'); return; }
  if (!_recog) _recog = _buildRecognition();
  try { _recog.lang = 'ar-SA'; _recog.start(); }
  catch(e) { toast('Could not start microphone: '+e.message); }
}
function stopVoice() { if (_recog) { try { _recog.stop(); } catch(e) {} } _stopRecordingUI(); }
function _stopRecordingUI() {
  _recording = false;
  const mb = document.getElementById('mic-btn'); if (mb) mb.classList.remove('recording');
  const vb = document.getElementById('voice-bar'); if (vb) vb.style.display = 'none';
  const inp = document.getElementById('user-input'); if (inp) inp.placeholder = 'Ask in Arabic or English…';
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _ttsEnabled = localStorage.getItem('tts_enabled') === 'true';
(function() {
  const btn = document.getElementById('tts-toggle-btn');
  if (btn) { btn.textContent = _ttsEnabled ? '🔊' : '🔇'; if (_ttsEnabled) btn.classList.add('on'); }
})();
function toggleTTS() {
  _ttsEnabled = !_ttsEnabled;
  localStorage.setItem('tts_enabled', _ttsEnabled);
  const btn = document.getElementById('tts-toggle-btn');
  btn.textContent = _ttsEnabled ? '🔊' : '🔇'; btn.classList.toggle('on', _ttsEnabled);
  toast(_ttsEnabled ? '🔊 Voice response ON' : '🔇 Voice response OFF');
  if (!_ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
}
function _speakText(text) {
  if (!_ttsEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text
    .replace(/```[\s\S]*?```/g,'').replace(/CHART_\w+:\{[^}]+\}/g,'')
    .replace(/[|─+]/g,'').replace(/#+\s/g,'').replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1')
    .replace(/\n{2,}/g,'. ').replace(/\n/g,' ').trim().slice(0,600);
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = /[؀-ۿ]/.test(clean) ? 'ar-SA' : 'en-US'; u.rate = 1.05; u.pitch = 1;
  window.speechSynthesis.speak(u);
}
